services:
  bot:
    build: .
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json:ro
      - ./storage:/app/storage
      - ./cache:/app/cache
      - ./normalized:/app/normalized

  web:
    build: .
    profiles: [web]
    restart: unless-stopped
    working_dir: /app/web
    command: ["flask", "--app", "app", "run", "--host", "0.0.0.0"]
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5000}:5000"
    volumes:
      - ./storage:/app/storage